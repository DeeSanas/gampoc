name: GAM PoC Smoke Test

on:
  push:
    branches:
      - chatgpt/poc-smoke-test
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p artifacts

      - name: Build and start GAM PoC
        run: |
          docker compose up -d --build

      - name: Wait for application
        shell: bash
        run: |
          set -e
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              echo "GAM PoC is responding on port 8080"
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready in time"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Capture baseline API responses
        run: |
          curl -fsS http://localhost:8080/ > artifacts/dashboard.html
          curl -fsS http://localhost:8080/api/summary > artifacts/summary-before.json
          curl -fsS http://localhost:8080/openapi.json > artifacts/openapi.json

      - name: Load included detector and signal demo data
        shell: bash
        run: |
          set -e
          curl -fsS -X POST \
            -F "file=@docs/sample_detector_log_14days_22detectors.txt" \
            http://localhost:8080/api/import/detector-log \
            | tee artifacts/import-detector.json

          curl -fsS -X POST \
            -F "file=@docs/sample_signal_log_14days.txt" \
            http://localhost:8080/api/import/signal-log \
            | tee artifacts/import-signal.json

      - name: Run forecasting and recommendations
        shell: bash
        run: |
          set -e
          curl -fsS -X POST \
            "http://localhost:8080/api/forecast/run?model_name=historical_average&horizons=15,30,60" \
            | tee artifacts/forecast-historical-average.json

          curl -fsS -X POST \
            "http://localhost:8080/api/forecast/run?model_name=gradient_boosting&horizons=15,30,60" \
            | tee artifacts/forecast-gradient-boosting.json

          curl -fsS -X POST \
            http://localhost:8080/api/recommendations/generate \
            | tee artifacts/recommendations-generate.json

          curl -fsS http://localhost:8080/api/summary > artifacts/summary-after.json
          curl -fsS http://localhost:8080/api/forecast/evaluation > artifacts/forecast-evaluation.json
          curl -fsS http://localhost:8080/api/forecast/results > artifacts/forecast-results.json
          curl -fsS http://localhost:8080/api/recommendations > artifacts/recommendations.json

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture real dashboard screenshot
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 } });
            await page.goto('http://localhost:8080', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(5000);
            await page.screenshot({ path: 'artifacts/gam-poc-dashboard.png', fullPage: true });
            await browser.close();
          })();
          NODE

      - name: Save container status and logs
        if: always()
        run: |
          docker compose ps > artifacts/docker-compose-ps.txt || true
          docker compose logs --no-color > artifacts/docker-compose-logs.txt || true

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gam-poc-smoke-test-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop containers
        if: always()
        run: docker compose down -v || true
